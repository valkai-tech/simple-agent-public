[project]
name = "take-home"
version = "0.1.0"
description = "Search-agent evaluation coding onsite"
requires-python = ">=3.13"
dependencies = [
    "chromadb",
    "deepagents",
    "fastapi",
    "filelock",
    "langchain",
    "langchain-anthropic",
    "langchain-google-genai",
    "langchain-openai",
    "openpyxl",
    "python-docx",
    "python-dotenv",
    "rank-bm25",
    "rapidfuzz>=3.14.3",
    "uvicorn[standard]",
]

[project.scripts]
chat = "agent.cli:main"
eval = "agent.eval.runner:main"
index = "agent.index_cli:main"
serve = "agent.server:main"
smoke = "agent.smoke:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
